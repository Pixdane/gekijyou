[workspace]
members = ["crates/gekijyou-computation", "crates/gekijyou-bevy", "benchmark"]
default-members = ["crates/gekijyou-computation"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
gekijyou-computation = { path = "crates/gekijyou-computation" }
gekijyou-bevy = { path = "crates/gekijyou-bevy" }
slotmap = "1.1.1"
smallvec = "1.16.3"
thiserror = "2.0.21"

[profile.perf]
inherits = "release"
debug = 1
