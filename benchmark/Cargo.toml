[package]
name = "benchmark"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
autobins = false

[dependencies]
gekijyou-computation = { workspace = true, features = ["p35-baseline"] }

[[bin]]
name = "timing"
path = "src/bin/timing.rs"

[[bin]]
name = "allocations"
path = "src/bin/allocations/main.rs"

[[bin]]
name = "snapshot_cost"
path = "src/bin/snapshot_cost.rs"

[[bin]]
name = "bevy_scene"
path = "src/bin/bevy_scene.rs"

[dependencies.gekijyou-bevy]
workspace = true
[dependencies.bevy_ecs]
version = "0.20.0"
[dependencies.bevy_math]
version = "0.20.0"
[dependencies.bevy_transform]
version = "0.20.0"

[dependencies.bevy_tasks]
version = "0.20.0"
features = ["multi_threaded"]

[[bin]]
name = "rework_timing"
path = "src/bin/rework_timing.rs"

[[bin]]
name = "rework_allocations"
path = "src/bin/rework_allocations.rs"
